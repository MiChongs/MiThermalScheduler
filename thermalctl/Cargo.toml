[package]
name = "thermalctl"
version = "2.4.0"
edition = "2024"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
